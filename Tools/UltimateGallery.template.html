<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black The Survival · 실험체 필살기 도트 시안</title>
<style>
:root{color-scheme:dark;font-family:"Malgun Gothic",system-ui,sans-serif;background:#0c1420;color:#e9edf2}*{box-sizing:border-box}body{margin:0}header{padding:24px max(20px,4vw);border-bottom:1px solid #354557;background:#142232}h1{font-size:24px;margin:7px 0}p{line-height:1.65;color:#b0c1d3;font-size:14px}.badge{font-size:12px;color:#f6a6da}main{display:grid;grid-template-columns:minmax(280px,350px) minmax(0,1fr);max-width:1440px;margin:auto;gap:24px;padding:24px}aside input{width:100%;padding:12px;background:#1c2c3d;color:white;border:1px solid #53677c;font:inherit}.list{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:75vh;overflow:auto;margin-top:12px}.card{display:flex;align-items:center;gap:8px;min-height:72px;text-align:left;padding:8px;background:#142232;border:1px solid #32475d;color:#e5edf5;cursor:pointer;font:inherit}.card.active{border:2px solid #e88ac1;background:#263249}.card:disabled{opacity:.45;cursor:default}.card img{width:45px;height:54px;object-fit:contain;image-rendering:pixelated}.card small{display:block;color:#91a7bc;font-size:10px;margin-top:5px}h2{margin-top:0}.stage{aspect-ratio:1;position:relative;max-width:554px;width:100%;margin:auto;overflow:hidden;background-color:#202938;background-image:linear-gradient(45deg,#283344 25%,transparent 25%),linear-gradient(-45deg,#283344 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#283344 75%),linear-gradient(-45deg,transparent 75%,#283344 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0;border:2px solid #52728c}.sprite{position:absolute;image-rendering:pixelated;background-repeat:no-repeat}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px 0}button,select{padding:9px 12px;color:#e9f1f7;background:#22374b;border:1px solid #58738c;font:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f294cf;outline-offset:3px}.status{text-align:center;color:#92dfd2;min-height:24px}a{color:#96e9e5}.links{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}.sheet{width:100%;image-rendering:pixelated}.sources a{font-size:12px}.empty{color:#9cb1c7;padding:15px}.counter{font-size:13px;color:#a2bece}@media(max-width:750px){main{display:flex;flex-direction:column;padding:15px}.list{max-height:220px;grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:5px;font-size:12px;min-height:56px}.card img{display:none}header{padding:18px}h1{font-size:21px}aside{order:0}article{order:1}}
</style>
<header><span class="badge">필살기 애니메이션 시안 · 게임 미적용</span><h1>실험체별 R 도트 애니메이션</h1><p>니아 시안의 도트 스타일을 기준으로, 각 실험체 R의 동작과 특징을 해석했습니다. 캐릭터를 골라 재생하거나 프레임을 하나씩 확인하세요.</p><span class="counter" id="count"></span></header>
<main><aside><input id="search" type="search" placeholder="실험체 이름 · 스킬 이름 검색" aria-label="실험체 검색"><div class="list" id="list"></div><p id="empty" hidden>검색 결과가 없습니다.</p></aside><article><h2 id="title"></h2><p id="motion"></p><div class="stage" id="stage"><div class="sprite" id="sprite"></div></div><div class="controls"><button id="play">일시 정지</button><button id="prev">◀ 이전</button><button id="next">다음 ▶</button><label>속도 <select id="speed"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option></select></label></div><div class="status" id="status" aria-live="off"></div><div class="links"><a id="gif">움직이는 GIF</a><a id="webp">투명 WebP</a><a id="atlas">원본 아틀라스</a></div><details><summary>전체 12프레임</summary><img id="sheet" class="sheet" alt="궁극기 원본 12프레임 시트" loading="lazy"></details><p class="sources" id="sources"></p><p>12프레임 · 기본 8fps · 1.5초 반복. 원본 생성 이미지는 보존하고 프레임 영역과 재생 위치만 조립했습니다. 게임의 실제 스킬 지속 시간이나 밸런스를 변경하지 않습니다.</p></article></main>
<style>.card[hidden]{display:none}</style>
<script id="catalog" type="application/json">__CATALOG__</script><script>
const catalog=JSON.parse(document.querySelector('#catalog').textContent),list=document.querySelector('#list'),sprite=document.querySelector('#sprite'),status=document.querySelector('#status');
let active=null,frame=0,playing=true,speed=1,last=performance.now(),elapsed=0;
document.querySelector('#count').textContent=`${catalog.filter(x=>x.ready).length} / ${catalog.length} 실험체 · 게임 미적용`;
function render(){if(!active)return;const [x,y]=active.offsets[frame],[left,top,right,bottom]=active.boxes[frame],[aw,ah]=active.atlas_size,w=right-left,h=bottom-top;sprite.style.left=x/active.canvas*100+'%';sprite.style.top=y/active.canvas*100+'%';sprite.style.width=w/active.canvas*100+'%';sprite.style.height=h/active.canvas*100+'%';sprite.style.backgroundSize=aw/w*100+'% '+ah/h*100+'%';sprite.style.backgroundPosition=left/(aw-w)*100+'% '+top/(ah-h)*100+'%';status.textContent=`${frame+1} / 12 · ${active.labels[frame]}`;}

function choose(item){if(!item.ready)return;active=item;frame=0;elapsed=0;last=performance.now();document.querySelector('#title').textContent=item.name+' R · '+item.ultimate;document.querySelector('#motion').textContent=item.motion||'컨트롤러로 게임월드를 펼치고 아케이드 블록을 터뜨립니다.';sprite.style.backgroundImage=`url("${item.atlas}")`;sprite.style.backgroundSize='400% 300%';sprite.style.width=sprite.style.height=item.cell/item.canvas*100+'%';document.querySelector('#sheet').src=item.atlas;for(const key of ['gif','webp','atlas'])document.querySelector('#'+key).href=item[key];const sources=document.querySelector('#sources');sources.replaceChildren();for(const s of item.sources||[]){const a=document.createElement('a');a.href=s.url;a.textContent=s.title;sources.append(a,document.createTextNode(' · '));}for(const card of list.children)card.classList.toggle('active',card.dataset.id===item.id);location.hash=item.id;render();}
function filter(){const q=document.querySelector('#search').value.trim().toLowerCase();let n=0;for(const card of list.children){card.hidden=!card.dataset.search.includes(q);if(!card.hidden)n++;}document.querySelector('#empty').hidden=n>0;}
for(const item of catalog){const card=document.createElement('button');card.className='card';card.dataset.id=item.id;card.dataset.search=(item.name+' '+item.id+' '+item.ultimate).toLowerCase();card.disabled=!item.ready;const text=document.createElement('span');text.textContent=item.name;const sub=document.createElement('small');sub.textContent=item.ready?item.ultimate:'제작 중';text.append(sub);if(item.thumb){const img=document.createElement('img');img.src=item.thumb;img.alt='';img.loading='lazy';card.append(img);}card.append(text);card.onclick=()=>choose(item);list.append(card);}
document.querySelector('#search').oninput=filter;document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'일시 정지':'재생';last=performance.now();};function step(d){playing=false;document.querySelector('#play').textContent='재생';frame=(frame+d+12)%12;elapsed=0;render();}document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);
function tick(now){const d=Math.min(now-last,1000);last=now;if(playing&&active){elapsed+=d*speed;while(elapsed>=125){frame=(frame+1)%12;elapsed-=125;}render();}requestAnimationFrame(tick);}choose(catalog.find(x=>x.id===location.hash.slice(1)&&x.ready)||catalog.find(x=>x.id==='nia'));requestAnimationFrame(tick);
</script></html>
