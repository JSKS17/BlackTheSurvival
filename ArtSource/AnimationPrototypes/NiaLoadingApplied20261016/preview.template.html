<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>니아 · 원 업 로딩 애니메이션 미리보기</title>
<style>
:root{color-scheme:dark;font-family:"Malgun Gothic",system-ui,sans-serif;background:#11121b;color:#f2effa}*{box-sizing:border-box}body{margin:0;padding:28px 20px 34px}main{max-width:1080px;margin:auto}.badge{display:inline-block;border:1px solid #a05b98;color:#fda3dc;font-size:12px;padding:5px 10px;margin-bottom:13px}h1{margin:0;font-size:26px;letter-spacing:-.04em}p{color:#b9b8cc;line-height:1.65;margin:12px 0}.stage{width:100%;aspect-ratio:960/520;border:1px solid #3a3549;border-radius:14px;overflow:hidden;margin:22px 0 15px;background:radial-gradient(ellipse at 65% 90%,#30233c,#151620 65%);box-shadow:0 24px 50px #0004}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.stage.grid{background-color:#292638;background-image:linear-gradient(45deg,#383346 25%,transparent 25%),linear-gradient(-45deg,#383346 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#383346 75%),linear-gradient(-45deg,transparent 75%,#383346 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}button,select{border:1px solid #63576f;background:#292231;color:#fbf3fa;border-radius:5px;padding:9px 13px;font:inherit;font-size:13px;cursor:pointer}button:hover{border-color:#e98bcd}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #8ce7f1;outline-offset:3px}.controls label{font-size:13px;color:#b9b8cc}input[type=range]{flex:1;min-width:160px;accent-color:#f58bd1}.status{min-height:25px;font-size:14px;color:#f8b9e2}.note{font-size:13px;color:#9896af}details{margin-top:20px;border-top:1px solid #373042;padding-top:14px}summary{cursor:pointer;color:#c9bdd6;font-size:14px}.sheet{max-width:680px;width:100%;height:auto;display:block;margin:18px auto;image-rendering:pixelated}a{color:#9ed6ed}.sequence{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.sequence span{font-size:12px;padding:5px 9px;background:#292331;border-radius:4px;color:#c1b6cb}.sequence span.active{background:#603b60;color:#ffe4f7}
</style>
<main><div class="badge">승인된 로딩 연출 · 걷기 수정본</div><h1>니아의 원 업</h1><p>오른쪽으로 걷던 니아 위로 게임 로고가 떨어집니다. 잠깐 납작해진 뒤, <strong>E · 원 업</strong>의 보라색 빛과 함께 부활해 다시 일어납니다.</p>
<div class="stage" id="stage"><canvas id="canvas" width="960" height="520" aria-label="니아가 걷다가 게임 로고에 깔린 뒤 원 업으로 부활하는 애니메이션"></canvas></div>
<div class="controls"><button id="play" type="button">일시 정지</button><button id="replay" type="button">처음부터</button><input id="time" type="range" min="0" max="7.999" step=".01" value="0" aria-label="재생 위치"><label>속도 <select id="speed"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option></select></label><button id="background" type="button">투명 배경 확인</button></div>
<p id="status" class="status" aria-live="off">불러오는 중</p><div class="sequence"><span>오른쪽 걷기</span><span>로고 낙하 · 깔림</span><span>E · 원 업</span><span>기상 · 대기</span></div>
<p class="note">8초 반복 · 양손으로 게임기를 계속 잡는 4개 보행 포즈 · 두 다리가 번갈아 접지하고 통과합니다. 이후 로고 낙하·깔림·원 업·기상은 승인된 연출을 유지했습니다.</p>
<p class="note"><a href="nia-loading-preview.webp">투명 애니메이션 WebP</a> · <a href="nia-loading-preview.gif">GIF</a> · <a href="generated-sheet.png">원본 포즈 시트</a></p>
<details><summary>니아 포즈 시트 보기</summary><img class="sheet" src="walk-sheet.png" alt="양손으로 게임기를 고정한 새로운 보행 포즈"><img class="sheet" src="generated-sheet.png" alt="걷기, 깔림, 원 업 부활과 기상으로 이어지는 니아 16개 포즈"></details></main>
<script>
const cells=/*CELLS*/;
const lerp=(a,b,t)=>a+(b-a)*t,clamp=t=>Math.max(0,Math.min(1,t));
/*STATE*/
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),slider=document.getElementById('time'),status=document.getElementById('status'),play=document.getElementById('play');ctx.imageSmoothingEnabled=false;
const load=name=>new Promise((resolve,reject)=>{const image=new Image;image.onload=()=>resolve(image);image.onerror=reject;image.src=name;});
Promise.all([load('generated-sheet.png'),load('game-logo.png'),load('one-up-effect.png'),load('walk-sheet.png')]).then(([atlas,logo,oneUp,walk])=>{
let t=0,playing=true,speed=1,last=performance.now();
function image(img,sx,sy,sw,sh,dx,dy,dw,dh,alpha=1){ctx.globalAlpha=alpha;ctx.drawImage(img,sx,sy,sw,sh,Math.round(dx),Math.round(dy),Math.round(dw),Math.round(dh));ctx.globalAlpha=1;}
function rect(x,y,w,h,color,alpha=1){ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h);ctx.globalAlpha=1;}
function render(){const s=state(t),c=cells[s.pose],scale=c.scale||1,character=c.image==='walk'?walk:atlas;ctx.clearRect(0,0,960,520);const drawLogo=()=>image(logo,0,0,logo.width,logo.height,s.lx-s.lw/2+s.shakeX,s.ly,s.lw,s.lw*logo.height/logo.width,s.opacity);
if(s.logoVisible&&t>=4.05)drawLogo();
if(s.fx){for(let j=0;j<5;j++)rect(574+j*23,130+(j%2)*16,10,320-(j%2)*16,'rgba(184,48,255,.27451)',s.fx);for(let j=0;j<9;j++){const yy=440-((t*130+j*31)%300);rect(555+(j*37)%165,yy,6+(j%2)*3,6+(j%2)*3,j%2?'rgba(111,241,255,.86275)':'rgba(245,108,255,.86275)',s.fx);}image(oneUp,0,0,oneUp.width,oneUp.height,520,10-(t-3.8)*20,220,330,s.fx*s.opacity);}
image(character,c.left,c.top,c.width,c.height,s.x-c.anchorX*scale+s.shakeX,450-c.anchorY*scale,c.width*scale,c.height*scale,s.opacity);if(s.logoVisible&&t<4.05)drawLogo();slider.value=t;status.textContent=t.toFixed(1)+' / 8.0초 · '+s.phase;document.querySelectorAll('.sequence span').forEach((el,i)=>el.classList.toggle('active',i===(t<2.6?0:t<3.8?1:t<5.05?2:3)));}
play.onclick=()=>{playing=!playing;play.textContent=playing?'일시 정지':'재생';last=performance.now();};document.getElementById('replay').onclick=()=>{t=0;playing=true;play.textContent='일시 정지';last=performance.now();render();};slider.oninput=()=>{t=Number(slider.value);playing=false;play.textContent='재생';render();};document.getElementById('speed').onchange=e=>speed=Number(e.target.value);document.getElementById('background').onclick=()=>document.getElementById('stage').classList.toggle('grid');
function tick(now){const dt=Math.min((now-last)/1000,.1);last=now;if(playing)t=(t+dt*speed)%8;render();requestAnimationFrame(tick);}render();requestAnimationFrame(tick);
}).catch(()=>status.textContent='이미지를 불러오지 못했습니다. 같은 폴더의 PNG 파일과 함께 열어 주세요.');
</script></html>
